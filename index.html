<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>צ'קליסט אבחון לגיל הגן</title>
    <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
    <style>

        :root {
            --bg: #f5f4f1;
            --card: rgba(255,255,255,.74);
            --ink: #26333b;
            --mute: #6a7a82;
            --line: rgba(60,90,100,.16);
            --field: rgba(255,255,255,.8);
            --acc: #467f5f;
            --acc2: #b8527a;
            --acc-ink: #fff;
            --c1: #467f5f;
            --c2: #b8527a;
            --c3: #6a7f2c;
            --c4: #9c4467;
            --w1: #93c9a6;
            --w2: #ee9fb9;
            --w3: #b6d490;
            --w4: #f0adc2;
            --wo: .55;
            --do: .17;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top,0px);
            padding-bottom: env(safe-area-inset-bottom,0px)
        }

        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #141a1e;
                --card: rgba(30,38,44,.78);
                --ink: #e9eff1;
                --mute: #98aab2;
                --line: rgba(180,210,220,.16);
                --field: rgba(20,27,32,.8);
                --acc: #7cc79a;
                --acc2: #e58fae;
                --acc-ink: #0f1a20;
                --c1: #7cc79a;
                --c2: #e58fae;
                --c3: #b4d076;
                --c4: #e08aa6;
                --wo: .24;
                --do: .13
            }
        }

        :root[data-theme="dark"] {
            --bg: #141a1e;
            --card: rgba(30,38,44,.78);
            --ink: #e9eff1;
            --mute: #98aab2;
            --line: rgba(180,210,220,.16);
            --field: rgba(20,27,32,.8);
            --acc: #7cc79a;
            --acc2: #e58fae;
            --acc-ink: #0f1a20;
            --c1: #7cc79a;
            --c2: #e58fae;
            --c3: #b4d076;
            --c4: #e08aa6;
            --wo: .24;
            --do: .13
        }

        * {
            box-sizing: border-box
        }

        html {
            scroll-padding-top: env(safe-area-inset-top,0px);
            background: var(--bg)
        }

        body {
            margin: 0;
            color: var(--ink);
            font-family: Heebo,Arial,sans-serif;
            line-height: 1.6;
            position: relative;
            min-height: 100vh
        }

            body::before {
                content: "";
                position: fixed;
                inset: -10%;
                z-index: -1;
                pointer-events: none;
                opacity: var(--wo);
                filter: blur(36px);
                background: radial-gradient(38% 30% at 12% 8%,var(--w1),transparent 70%),radial-gradient(34% 28% at 92% 22%,var(--w2),transparent 70%),radial-gradient(40% 32% at 8% 58%,var(--w3),transparent 70%),radial-gradient(36% 30% at 95% 78%,var(--w4),transparent 70%),radial-gradient(30% 24% at 40% 98%,var(--w2),transparent 70%)
            }

        main {
            max-width: 740px;
            margin: 0 auto;
            padding: 28px 16px 70px
        }

        h1 {
            font-family: "Frank Ruhl Libre",Georgia,serif;
            font-weight: 700;
            font-size: 2.4rem;
            line-height: 1.2;
            margin: 10px 0 6px;
            position: relative;
            display: inline-block
        }

            h1::after {
                content: "";
                position: absolute;
                inset-inline: -6px;
                bottom: -2px;
                height: 12px;
                border-radius: 50%;
                background: linear-gradient(to left,var(--c1),var(--c2),var(--c3),var(--c4));
                opacity: .28;
                filter: blur(5px);
                z-index: -1
            }

        .lead {
            color: var(--mute);
            margin: 0 0 22px;
            font-size: 1.02rem
        }

        .card {
            background: var(--card);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--line);
            border-radius: 18px 14px 20px 14px;
            padding: 16px 18px;
            margin-bottom: 14px;
            box-shadow: 0 6px 22px -12px rgba(50,80,95,.35)
        }

        .dom .card {
            background: linear-gradient(to left,color-mix(in srgb,var(--dc) 16%,transparent),transparent 45%),var(--card)
        }

        #tasks > .dom:nth-child(1) {
            --dc: var(--c1)
        }

        #tasks > .dom:nth-child(2) {
            --dc: var(--c2)
        }

        #tasks > .dom:nth-child(3) {
            --dc: var(--c3)
        }

        #tasks > .dom:nth-child(4) {
            --dc: var(--c4)
        }

        .row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap
        }

            .row > label {
                flex: 1;
                min-width: 150px;
                display: flex;
                flex-direction: column;
                font-size: .9rem;
                color: var(--mute);
                gap: 4px
            }

        input, select, textarea {
            font: inherit;
            color: var(--ink);
            background: var(--field);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 8px 11px;
            width: 100%
        }

            input:focus, select:focus, textarea:focus, button:focus-visible {
                outline: 2px solid var(--acc);
                outline-offset: 1px
            }

        .task-head {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px
        }

            .task-head input {
                font-weight: 700;
                font-size: 1.05rem;
                border-color: transparent;
                background: transparent;
                padding-inline: 0
            }

                .task-head input:focus {
                    background: var(--field);
                    padding-inline: 11px
                }

        .x {
            background: none;
            border: 0;
            color: var(--mute);
            font-size: 1.3rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px
        }

            .x:hover {
                color: var(--ink)
            }

        .seg {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 10px
        }

            .seg button {
                font: inherit;
                border: 1px solid var(--line);
                background: var(--field);
                color: var(--ink);
                border-radius: 999px;
                padding: 5px 15px;
                cursor: pointer;
                transition: background .15s,color .15s
            }

        .dom .seg button[aria-pressed="true"] {
            background: var(--dc);
            color: var(--acc-ink);
            border-color: var(--dc)
        }

        textarea {
            min-height: 42px;
            resize: vertical
        }

        .dom h2 {
            font-family: "Frank Ruhl Libre",Georgia,serif;
            font-size: 1.55rem;
            color: var(--dc);
            margin: 34px 0 14px;
            position: relative;
            display: inline-block
        }

            .dom h2::after {
                content: "";
                position: absolute;
                inset-inline: -10px;
                bottom: 1px;
                height: 11px;
                border-radius: 50%;
                background: var(--dc);
                opacity: .22;
                filter: blur(4px);
                z-index: -1
            }

        .dom > .btn {
            margin-bottom: 6px
        }

        .sub {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 7px 0;
            border-top: 1px dashed var(--line)
        }

            .sub .seg {
                margin: 0;
                flex-shrink: 0
            }

        .btn {
            font: inherit;
            font-weight: 700;
            border: 0;
            border-radius: 12px;
            padding: 11px 22px;
            cursor: pointer;
            background: linear-gradient(to left,var(--acc),var(--acc2));
            color: var(--acc-ink);
            box-shadow: 0 8px 18px -10px var(--acc)
        }

            .btn:disabled {
                opacity: .6;
                cursor: not-allowed
            }

            .btn.ghost {
                background: transparent;
                color: var(--dc,var(--acc));
                border: 1px solid var(--dc,var(--acc));
                box-shadow: none
            }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 16px 0
        }

        #outCard {
            border-radius: 20px 14px 18px 14px;
            padding: 22px 24px;
            background: linear-gradient(to left,color-mix(in srgb,var(--c2) 14%,transparent),transparent 40%),var(--card)
        }

        #out {
            font-size: 1.06rem;
            line-height: 1.95;
            white-space: pre-wrap
        }

        #msg {
            color: var(--mute);
            font-size: .9rem;
            min-height: 1.4em;
            align-self: center
        }
    </style>

</head>

    <main>
        <h1>צ'קליסט אבחון לגיל הגן</h1>

        <div id="main_app">
            <p class="lead">גילאי 3 עד 6. סמני בכל פריט איך היה, ובסוף לחצי על "כתבי לי סיכום".</p>

            <!-- טופס פרטי המאובחן -->
            <div class="card row">

                <label>תאריך לידה<input id="bdate" type="date"></label>
                <label>מין<select id="gender"><option value="m">בן</option><option value="f">בת</option></select></label>
                <label>תאריך<input id="date" type="date"></label>
            </div>

            <!-- אזור ייצור השאלות הדינמי -->
            <div id="tasks"></div>

            <!-- כפתורי פעולה עליונים -->
            <div class="actions">
                <button class="btn" id="gen">כתבי לי סיכום ושמרי ל-Drive</button>
                <span id="msg"></span>
            </div>
        </div>

        <!-- כרטיס תוצאת הסיכום (מוסתר בהתחלה) -->
        <div class="card" id="outCard" hidden>
            <div id="out"></div>
            <div class="actions">
                <button class="btn ghost" id="copy">העתקת הטקסט</button>
                <button class="btn ghost" id="saveDrive">שמירה נוספת ל-Drive</button>
            </div>
        </div>
    </main>

    <script>

                        g.subs.forEach(function (sb) {
                            var r = el("div", "sub"); r.append(el("span", "", sb.name));
                            r.append(chips([sb.by, sb.bn], function () { return g.v[sb.name] === "y" ? sb.by : g.v[sb.name] === "n" ? sb.bn : "" }, function (v) { g.v[sb.name] = v === sb.by ? "y" : v === sb.bn ? "n" : "" }));
                            c.append(r);
                        });
                    });
                    if (t.rate) c.append(chips(LEVELS.map(function (l) { return l[1] }), function () { var l = LEVELS.filter(function (l) { return l[0] === t.level })[0]; return l ? l[1] : "" }, function (v) { var l = LEVELS.filter(function (l) { return l[1] === v })[0]; t.level = l ? l[0] : "" }));
                    var ta = el("textarea"); ta.placeholder = "הערה (לא חובה)"; ta.value = t.note; ta.oninput = function () { t.note = ta.value };
                    c.append(ta); sec.append(c);
                });
                var add = el("button", "btn ghost", "+ הוספת פריט ל" + d.title);
                add.onclick = function () { d.items.push(I("", { rate: true })); render() };
                sec.append(add); tEl.append(sec);
            });
        }
        render();

        // ==============================================
        // 3. יצירת סיכום גנרי (Fallback)
        // ==============================================
        function calculateAge(bdate, diagDate) {
            if (!bdate) return "";
            var b = new Date(bdate), d = new Date(diagDate || new Date());
            var m = (d.getFullYear() - b.getFullYear()) * 12 + (d.getMonth() - b.getMonth());
            if (d.getDate() < b.getDate()) m--;
            var y = Math.floor(m / 12), remM = m % 12;
            return y + " שנים ו-" + remM + " חודשים";
        }

        function generateGenericReport(data) {
            var age = calculateAge(data["תאריך לידה"], data["תאריך אבחון"]);
            var header = "סיכום אבחון בריפוי בעיסוק\n";
            header += "שם: " + data["שם הילד"] + "\n";
            header += "מין: " + data["מין"] + "\n";
            if (age) header += "גיל בזמן האבחון: " + age + "\n";
            header += "תאריך אבחון: " + data["תאריך אבחון"] + "\n\n";

            var domainsMap = {};
            data["מדדים"].forEach(function (m) {
                if (!domainsMap[m["תחום"]]) domainsMap[m["תחום"]] = [];
                domainsMap[m["תחום"]].push("- " + m["מיומנות"] + ": " + m["פירוט"]);
            });

            var body = "";
            for (var dom in domainsMap) {
                body += dom + ":\n"; // כותרת נקייה ללא סולמיות
                body += domainsMap[dom].join("\n") + "\n\n";
            }

            if (!body) body = "לא סומנו מדדים במהלך האבחון.";
            return header + body;
        }

        // ==============================================
        // 4. ניהול הרשאות Google Drive
        // ==============================================
        let driveTokenClient = null;
        let driveAccessToken = null;

        function ensureDriveToken() {
            return new Promise(function (resolve, reject) {
                if (driveAccessToken) return resolve(driveAccessToken);
                if (!window.google || !google.accounts || !google.accounts.oauth2) {
                    return reject(new Error("ספריית ההתחברות של Google לא נטענה"));
                }
                driveTokenClient = google.accounts.oauth2.initTokenClient({
                    client_id: CLIENT_ID,
                    scope: 'https://www.googleapis.com/auth/drive.file',
                    callback: function (resp) {
                        if (resp.access_token) {
                            driveAccessToken = resp.access_token;
                            resolve(driveAccessToken);
                        } else {
                            reject(new Error("לא התקבל אישור גישה ל-Drive"));
                        }
                    }
                });
                driveTokenClient.requestAccessToken();
            });
        }

        // ==============================================
        // 5. הפקת דוח (AI או גנרי) - ללא בקשת דרייב!
        // ==============================================
        document.getElementById("gen").onclick = async function () {
            const btn = document.getElementById("gen");
            const out = document.getElementById("out");
            const card = document.getElementById("outCard");
            const msg = document.getElementById("msg");
            const apiUrl = "https://yaelclinicapi.onrender.com/api/Diagnosis/generate-report";

            // נעילת הכפתור ומעבר למצב המתנה
            btn.disabled = true;
            const originalBtnText = btn.innerText;
            btn.innerText = "מעבד נתונים...";
            card.hidden = false;
            out.innerText = "מפיק סיכום, אנא המתן...";
            msg.innerText = "";

            // איסוף הנתונים מהטופס
            var reportData = {
                "שם הילד": document.getElementById("name").value.trim() || "ללא שם",
                "מין": document.getElementById("gender").value === "m" ? "בן" : "בת",
                "תאריך לידה": document.getElementById("bdate").value,
                "תאריך אבחון": document.getElementById("date").value,
                "מדדים": []
            };

            domains.forEach(function (dm) {
                dm.items.forEach(function (t) {
                    if (t.name.trim()) {
                        let details = "";
                        if (t.sel) details += "בחירה: " + (t.sel === "אחר" ? t.otherText : t.sel) + ". ";
                        if (t.level) {
                            var levHeb = LEVELS.find(function (l) { return l[0] === t.level });
                            details += "רמה: " + (levHeb ? levHeb[1] : t.level) + ". ";
                        }
                        if (t.groups) {
                            t.groups.forEach(function (g) {
                                var selected = [];
                                g.subs.forEach(function (sb) {
                                    if (g.v[sb.name] === "y") selected.push(sb.y);
                                    else if (g.v[sb.name] === "n") selected.push(sb.n);
                                });
                                if (selected.length) details += selected.join(", ") + ". ";
                            });
                        }
                        if (t.note) details += "הערות: " + t.note;

                        if (details.length > 0) {
                            reportData["מדדים"].push({ "תחום": dm.title, "מיומנות": t.name, "פירוט": details });
                        }
                    }
                });
            });

            let finalReportText = "";
            try {
                // פנייה לשרת ה-AI
                const response = await fetch(apiUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(reportData)
                });

                if (!response.ok) throw new Error("HTTP " + response.status);

                const jsonResponse = await response.json();
                let rawText = jsonResponse.candidates[0].content.parts[0].text;

                // ניקוי כוכביות ותוספת חיווי מודל AI
                finalReportText = rawText.replace(/\*\*/g, '').replace(/\*/g, '-');
                finalReportText += "\n\n-------------------\n[הדוח נוסח על ידי בינה מלאכותית]";
            }
            catch (error) {
                // נסיגה לסיכום הגנרי במקרה של שגיאה ותוספת חיווי מתאים
                finalReportText = generateGenericReport(reportData);
                finalReportText += "\n\n-------------------\n[הדוח הופק בתבנית גיבוי גנרית עקב חוסר זמינות של השרת]";
            }

            // הצגת התוצאה למסך (עדיין לא שומרים לדרייב)
            out.innerText = finalReportText;

            // החזרת הכפתור למצב פעיל
            btn.disabled = false;
            btn.innerText = originalBtnText;
        };

        // ==============================================
        // 6. פונקציית שמירה ל-Google Docs
        // ==============================================
        async function executeUploadToDrive(txtContent) {
            const txt = txtContent || document.getElementById("out").innerText;
            const nm = document.getElementById("name").value.trim() || "ללא_שם";
            const dt = document.getElementById("date").value || new Date().toISOString().slice(0, 10);
            const title = "סיכום_אבחון_" + nm + "_" + dt;
            const msg = document.getElementById("msg");

            msg.innerText = (msg.innerText ? msg.innerText + " " : "") + "ממיר ושומר ב-Docs...";

            const metadata = {
                name: title,
                mimeType: 'application/vnd.google-apps.document'
            };

            const form = new FormData();
            form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
            form.append('file', new Blob([txt], { type: 'text/plain;charset=utf-8' }));

            try {
                const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + driveAccessToken },
                    body: form
                });

                if (res.ok) {
                    msg.innerText = "✓ הדוח נשמר בהצלחה כקובץ Google Docs!";
                } else {
                    msg.innerText = "שגיאה בשמירה ל-Docs (" + res.status + ")";
                }
            } catch (err) {
                msg.innerText = "תקלה בתקשורת מול Drive.";
            }
        }

        // ==============================================
        // 7. כפתורי שמירה נוספת והעתקה
        // ==============================================
        document.getElementById("saveDrive").onclick = async function () {
            const msg = document.getElementById("msg");
            try {
                msg.innerText = "מוודא חיבור ל-Drive...";
                await ensureDriveToken(); // בקשת ההרשאה מוקפצת רק כאן
                await executeUploadToDrive();
            } catch (err) {
                msg.innerText = "השמירה בוטלה: לא ניתן אישור להתחבר ל-Google Drive.";
            }
        };

        document.getElementById("copy").onclick = function () {
            var txt = document.getElementById("out").innerText, msg = document.getElementById("msg");
            navigator.clipboard.writeText(txt).then(function () {
                msg.textContent = "הטקסט הועתק ללוח ✓";
                setTimeout(function () { msg.textContent = "" }, 2500);
            });
        };
    </script>
