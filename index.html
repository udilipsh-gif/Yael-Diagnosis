// 2. הפקת סיכום מול שרת ה-C# בלחיצה
document.getElementById("gen").onclick = async function() {
  const btn = document.getElementById("gen");
  const out = document.getElementById("out");
  const card = document.getElementById("outCard");
  const apiUrl = "https://localhost:7232/api/Diagnosis/generate-report"; 

  btn.disabled = true;
  const originalBtnText = btn.innerText;
  btn.innerText = "מפיק סיכום... אנא המתן";
  
  card.hidden = false;
  out.innerText = "מנתח את הנתונים ומפיק דוח (זה עשוי לקחת מספר שניות)...";

  var reportData = {
    "שם הילד": document.getElementById("name").value || "ללא שם",
    "מין": document.getElementById("gender").value === "m" ? "בן" : "בת",
    "תאריך לידה": document.getElementById("bdate").value,
    "תאריך אבחון": document.getElementById("date").value,
    "מדדים": []
  };

  domains.forEach(function(dm) {
    dm.items.forEach(function(t) {
      if (t.name.trim()) {
        let details = "";
        if (t.sel) details += "בחירה: " + (t.sel === "אחר" ? t.otherText : t.sel) + ". ";
        if (t.level) details += "רמה: " + t.level + ". ";
        if (t.note) details += "הערות: " + t.note;

        if (details.length > 0) {
          reportData["מדדים"].push({ "תחום": dm.title, "מיומנות": t.name, "פירוט": details });
        }
      }
    });
  });

  try {
    const response = await fetch(apiUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(reportData)
    });

    if (!response.ok) {
      throw new Error("שגיאה בשרת (" + response.status + ")");
    }

    const jsonResponse = await response.json();
    const geminiText = jsonResponse.candidates[0].content.parts[0].text;
    out.innerText = geminiText;

  } catch (error) {
    out.innerText = "אירעה שגיאה בעת הפקת הסיכום: " + error.message;
  } finally {
    btn.disabled = false;
    btn.innerText = originalBtnText;
  }
};

// 4. מנגנון שמירה ב-Google Drive
let driveTokenClient = null;
let driveAccessToken = null;

function initDriveAuth() {
  if (window.google && google.accounts && google.accounts.oauth2) {
    driveTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: 'https://www.googleapis.com/auth/drive.file',
      callback: (response) => {
        if (response.access_token) {
          driveAccessToken = response.access_token;
          executeUploadToDrive();
        } else {
          document.getElementById("msg").innerText = "לא התקבל אישור גישה ל-Drive.";
        }
      },
    });
  }
}

window.addEventListener("load", function() {
  setTimeout(initDriveAuth, 500);
});

document.getElementById("saveDrive").onclick = function() {
  var txt = document.getElementById("out").innerText;
  if (!txt.trim()) {
    alert("אין תוכן לשמירה. הפיקי סיכום תחילה.");
    return;
  }

  if (!driveAccessToken) {
    if (!driveTokenClient) initDriveAuth();
    if (driveTokenClient) {
      driveTokenClient.requestAccessToken();
    } else {
      alert("ספריית גוגל עדיין לא נטענה בדפדפן. נסי שוב עוד רגע.");
    }
  } else {
    executeUploadToDrive();
  }
};

async function executeUploadToDrive() {
  const txt = document.getElementById("out").innerText;
  const nm = document.getElementById("name").value.trim() || "ללא_שם";
  const dt = document.getElementById("date").value || new Date().toISOString().slice(0,10);
  const title = "סיכום_אבחון_" + nm + "_" + dt + ".txt";
  const msg = document.getElementById("msg");

  msg.innerText = "שומר ב-Google Drive...";

  const metadata = {
    name: title,
    mimeType: 'text/plain'
  };

  const form = new FormData();
  form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
  form.append('file', new Blob([txt], { type: 'text/plain;charset=utf-8' }));

  try {
    const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + driveAccessToken },
      body: form
    });

    if (res.ok) {
      msg.innerText = "✓ הקובץ נשמר בהצלחה ב-Drive!";
    } else {
      msg.innerText = "שגיאה בשמירה ל-Drive (" + res.status + ")";
    }
  } catch (err) {
    msg.innerText = "תקלה בתקשורת מול Drive.";
  }
}
